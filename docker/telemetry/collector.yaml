# The rig's collector: one OTLP endpoint in, one destination per signal out.
#
# This file is the swap TO-BE §12 promises. Both processes that emit — the control
# plane and each burst — know one address and nothing else; which viewer holds
# their spans is decided here, in a dev-only file, and changing it changes no
# platform code and no environment variable.
#
# An OTLP receiver, two OTLP/HTTP exporters and one rename is the whole rig. The
# rename is the only reason this needs the **contrib** image rather than core: the
# `transform` processor lives there. Worth knowing before adding a second one — a
# processor here rewrites signals the platform will be judged on, and the rule that
# keeps that honest is below: translate names, never invent numbers.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318 # what both emitters push to (only this one is published)
      grpc:
        endpoint: 0.0.0.0:4317 # nothing uses it yet; a sidecar or an SDK might

processors:
  batch:
    # A rig is watched by a human waiting for a burst to show up, so latency beats
    # throughput: the emitters already export every second (B2).
    timeout: 1s

  transform/token_usage:
    # The CLI reports usage under its own names, so every viewer's token and cost
    # accounting reads zero while the numbers sit in the attributes. Renaming them to
    # the OTel GenAI convention belongs *here* and not in the platform: the emitted
    # signal stays what the CLI produces, and the translation lives in the dev-only
    # file that already decides where signals go.
    #
    # Additive on purpose — the original attributes stay, because `input_tokens` is
    # what the CLI documents and a query written against it should keep working.
    # `error_mode: ignore` because a span missing one of these is normal (a tool span
    # has no tokens at all), and one skipped statement must not drop the batch.
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["span.type"] == "llm_request"
        statements:
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where attributes["output_tokens"] != nil
          # Prompt tokens are summed from three counters the CLI keeps apart, because
          # `input_tokens` alone is the *uncached* remainder — 2, on a request that
          # actually sent 29k. A viewer showing 2 would be worse than showing zero.
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["cache_read_tokens"]) where attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["cache_creation_tokens"]) where attributes["cache_creation_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], attributes["cache_read_tokens"]) where attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], attributes["cache_creation_tokens"]) where attributes["cache_creation_tokens"] != nil
          # The cache split, in OpenInference's names — the one place this file speaks a
          # viewer's dialect instead of the standard, and it is load-bearing. Phoenix
          # derives its own token counts from the `gen_ai.usage.*` above, but reads the
          # *breakdown* only from these, and without it every cached token is priced as
          # fresh input: measured at 5.6x the burst row's cost on a warm session
          # (2026-08-19). An overstated number in a viewer is worse than no number.
          - set(attributes["llm.token_count.prompt_details.cache_read"], attributes["cache_read_tokens"]) where attributes["cache_read_tokens"] != nil
          - set(attributes["llm.token_count.prompt_details.cache_write"], attributes["cache_creation_tokens"]) where attributes["cache_creation_tokens"] != nil

exporters:
  otlphttp/phoenix:
    # Phoenix is traces-only, so the endpoint is set per signal rather than by base
    # URL — an `endpoint:` here would also claim to accept logs and metrics.
    traces_endpoint: http://phoenix:6006/v1/traces

  otlphttp/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    headers:
      # Which fields become *stream* fields — and `service.name` is the only one of
      # ours that may. Two reasons, one measured the hard way (2026-08-19):
      #
      #   * The CLI puts `task.id` / `burst.id` / `burst.role` / `burst.kind` on the
      #     resource *and* on every log record, so each name matches twice.
      #     VictoriaLogs answers a duplicate stream tag with a FATAL panic that takes
      #     the whole process down — not the request, the process — after which the
      #     collector reports `lookup victorialogs: no such host` and the cause is
      #     two containers away. Naming any correlation id here breaks the rig.
      #   * `burst.id` is unbounded anyway: a stream per burst is exactly the
      #     cardinality VictoriaLogs warns about.
      #
      # Nothing is lost. Every attribute is still an ordinary field, so
      # `burst.id:"58e70f71c6aa"` and `trace_id:"…"` find the burst — which is all
      # correlation needs. Streams are about how the data is laid out.
      VL-Stream-Fields: service.name

  debug:
    # The rig's answer to "did anything arrive?" — per-batch counts in
    # `docker compose logs otel-collector`, no bodies. The emitters cannot tell you:
    # the CLI drops export failures silently, and the control plane's exporter logs
    # nothing either.
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/token_usage, batch]
      exporters: [otlphttp/phoenix, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victorialogs, debug]
    # No metrics pipeline, on purpose. The ledger is the metrics store (TO-BE §12),
    # so an exported metric is a second copy of a ledger fact — and a collector with
    # nowhere to put it refuses the export rather than quietly storing it. If this
    # rig ever starts rejecting metrics you did not know were being sent, that is
    # the wall working.
  telemetry:
    logs:
      level: info
