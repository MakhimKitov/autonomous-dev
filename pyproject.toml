[project]
name = "autonomous-dev"
version = "0.1.0"
description = "An autonomous AI developer that maintains a target codebase via the Claude agent loop."
readme = "README.md"
authors = [
    { name = "MakhimKitov", email = "titov.ms.msu@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
autonomous-dev = "autonomous_dev:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
