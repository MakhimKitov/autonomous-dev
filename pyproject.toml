[project]
name = "autonomous-dev"
version = "0.1.0"
description = "Autonomous maintenance platform: control plane + the dev-agent image it runs."
readme = "README.md"
authors = [
    { name = "MakhimKitov", email = "titov.ms.msu@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "control-plane",
    "dev-agent",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
control-plane = { workspace = true }
dev-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
